*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ui);
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
.hdr{position:sticky;top:0;z-index:10;background:var(--header);backdrop-filter:blur(20px);
  border-bottom:.5px solid var(--hair);padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
  display:flex;align-items:center;justify-content:space-between;gap:10px}
.hdr h1{margin:0;font:700 22px/25px var(--ui);letter-spacing:-.5px}
.hdr .meta{font:400 11px var(--mono);color:var(--sub);margin-top:3px}
.pill{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--card);
  border:.5px solid var(--hair);border-radius:999px;font:590 12.5px var(--mono);color:var(--accent);cursor:pointer}
.icon{width:34px;height:34px;padding:0;justify-content:center;font-size:13px}
.wrap{padding:14px 14px 40px;display:flex;flex-direction:column;gap:12px;
  max-width:560px;margin:0 auto}
.fresh{display:flex;align-items:center;justify-content:center;gap:7px;padding:10px;background:var(--card);
  border:.5px solid var(--hair);border-radius:11px;font:400 11.5px var(--mono);color:var(--sub);cursor:pointer}
.stale{background:rgba(255,159,10,.12);border-color:rgba(255,159,10,.4);color:var(--deep-pend)}
.card{background:var(--card);border:.5px solid var(--hair);border-radius:16px;padding:14px 15px 13px;
  display:flex;flex-direction:column;gap:11px}
.jobcard{cursor:pointer}
.row{display:flex;align-items:flex-start;gap:10px}
.name{font:590 15px var(--mono);letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app{font:400 11.5px var(--ui);color:var(--sub)}
.chip{flex:none;display:flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;
  font:590 10.5px var(--mono);letter-spacing:.2px}
.dot{width:7px;height:7px;border-radius:999px;display:block}
.bar{height:4px;border-radius:999px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px}
.barlbl{display:flex;justify-content:space-between;font:400 10.5px var(--mono);color:var(--sub)}
.tiles{display:flex;gap:9px}
.tile{flex:1;background:var(--fill);border-radius:9px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.tile b{font:700 16px var(--mono);letter-spacing:-.4px}
.tile span{font:400 10px var(--ui);color:var(--sub)}
.note{border-radius:9px;padding:8px 10px;font:400 10.5px/15px var(--mono)}
.fail{background:rgba(255,59,48,.11);color:var(--failtext)}
.soft{background:var(--fill);color:var(--sub)}
.sect{font:590 13px var(--ui);letter-spacing:-.1px}
.sub{font:400 11px var(--mono);color:var(--dim)}
.stats{display:flex;gap:22px}
.stats div{display:flex;flex-direction:column;gap:2px}
.stats b{font:700 17px var(--mono);letter-spacing:-.3px}
.stats span{font:400 10.5px var(--ui);color:var(--sub)}
.mons{display:flex;gap:6px;flex-wrap:wrap}
.mon{padding:5px 10px;border-radius:999px;background:var(--fill);color:var(--sub);
  font:590 11px var(--mono);cursor:pointer}
.mon.on{background:var(--chip);color:var(--accent)}
.big{font:700 22px var(--mono);letter-spacing:-.5px}
.read{font:400 13.5px/1.55 var(--ui);text-wrap:pretty}
.bullet{display:flex;gap:8px;align-items:baseline}
.bullet i{flex:none;width:5px;height:5px;border-radius:999px;transform:translateY(-2px)}
.bullet span{font:400 11.5px/1.5 var(--mono);color:var(--sub)}
.back{display:flex;align-items:center;gap:2px;color:var(--accent);font-size:17px;cursor:pointer;letter-spacing:-.2px}
.back i{font-size:22px;line-height:17px;font-weight:300;font-style:normal}
.logcard{background:var(--log);border:.5px solid rgba(255,255,255,.08);border-radius:14px;
  padding:13px 14px 12px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.logcard div{font:400 10.5px/15px var(--mono);color:rgba(235,235,245,.8);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logview{background:var(--log);min-height:100vh}
.logview .hdr{background:var(--log);border-color:rgba(255,255,255,.12)}
.logview .hdr h1{font:590 13px var(--mono);color:#f2f2f7}
.logline{display:flex;gap:12px;padding:1.5px 14px 1.5px 10px;font:400 11.5px/17px var(--mono)}
.logline i{flex:none;width:44px;text-align:right;color:rgba(255,255,255,.25);font-style:normal}
.logline span{color:rgba(235,235,245,.88);white-space:pre-wrap;word-break:break-word}
.foot{display:flex;flex-direction:column;gap:4px;padding:2px 4px}
.foot div{font:400 10.5px/1.6 var(--mono);color:var(--dim)}
.dimmed{opacity:.45}
svg{display:block;width:100%}

      'color:var(--deep-' + j.status + ')"><i class="dot" style="background:var(--' + j.status + ')"></i>' +
      esc(j.state) + '</div></div>';

    if (m && m.history && m.history.length > 1) {
      h += '<div style="display:flex;align-items:flex-end;gap:12px">' +
        '<div style="flex:none;display:flex;flex-direction:column;gap:2px">' +
        '<span style="font:400 10px var(--mono);color:var(--sub)">' + esc(m.label) + '</span>' +
        '<span style="font:700 15px var(--mono);letter-spacing:-.3px;color:var(--accent)">' + esc(m.now) + '</span>' +
        '</div><div style="flex:1">' + chart(m.history, 44) + '</div></div>';
    }
    if (j.status === 'pend') {
      h += '<div class="tiles"><div class="tile"><b>' + esc(j.queue_pos || '—') + '</b><span>of ' +
        esc(j.queue_total || '—') + ' in ' + esc(j.queue || 'queue') + '</span></div>' +
        '<div class="tile"><b>' + esc(j.eta_start || '—') + '</b><span>est. start</span></div></div>';
    }
    if (j.status === 'idle') h += '<div class="note soft">nothing started yet — newest file ' + esc(j.newest || '—') + '</div>';
    if (j.status === 'critical') h += '<div class="note fail">' + esc((j.notes || [{}])[0].txt || j.state_note) + '</div>';

    h += '<div style="display:flex;flex-direction:column;gap:5px">' +
      '<div class="bar"><i style="width:' + pct(j.pct) + ';background:var(--' + j.status + ')"></i></div>' +
      '<div class="barlbl"><span>' + esc(j.elapsed || j.state_note || '—') + '</span><span>' +
      (j.limit ? 'of ' + esc(j.limit) : '') + '</span></div></div></div>';
  });

  h += '<div class="foot"><div>/track-job · ' + js.length + ' dirs on ' + esc(cl) + '</div>' +
    '<div>status.json written ' + esc((S.polled_at || '').replace('T', ' ').slice(0, 16)) +
    ' · next poll ' + esc((S.next_poll || '').slice(11, 16) || '—') + ' · read-only</div></div></div>';
  return h;
}

function detailView() {
  var j = job(st.sel);
  if (!j) { st.view = 'list'; return listView(); }
  var mons = j.monitors || [], i = Math.min(st.mon, Math.max(mons.length - 1, 0)), m = mons[i] || null;
  var h = '<div class="hdr"><div class="back" onclick="go({view:\'list\',sel:null})"><i>‹</i>Jobs</div>' +
    '<div style="font:590 13px var(--mono)">' + esc(j.id || '—') + '</div><div style="width:44px"></div></div>';
  h += '<div class="wrap">';
  h += '<div style="display:flex;flex-direction:column;gap:7px"><div style="font:700 24px/28px var(--ui);' +
    'letter-spacing:-.5px">' + esc(j.label || j.name) + '</div><div style="font:400 12px var(--mono);color:var(--sub)">' +
    esc(j.cluster) + ' / ' + esc(j.queue || '—') + ' · ' + esc(j.sched || '') + ' · ' + esc(j.kind) + '</div></div>';

  h += '<div class="card"><div class="row" style="align-items:center;justify-content:space-between">' +
    '<div style="display:flex;align-items:center;gap:8px"><i class="dot" style="width:9px;height:9px;' +
    'background:var(--' + j.status + ')"></i><span style="font:590 15px var(--ui);letter-spacing:-.2px">' +
    esc(j.state) + '</span></div><span style="font:400 12px var(--mono);color:var(--sub)">' +
    esc(j.state_note || '') + '</span></div>';
  if (j.elapsed) h += '<div style="display:flex;flex-direction:column;gap:6px">' +
    '<div class="bar" style="height:6px"><i style="width:' + pct(j.pct) + ';background:var(--' + j.status + ')"></i></div>' +
    '<div class="barlbl"><span>' + esc(j.elapsed) + ' wall</span><span>limit ' + esc(j.limit || '—') + '</span></div></div>';
  if (j.sim_pct != null) h += '<div style="display:flex;flex-direction:column;gap:6px">' +
    '<div class="bar" style="height:6px"><i style="width:' + pct(j.sim_pct) + ';background:var(--accent)"></i></div>' +
    '<div class="barlbl"><span>t = ' + esc(j.sim_now) + '</span><span>target ' + esc(j.sim_target) + '</span></div></div>';
  if (j.status === 'pend') h += '<div class="tiles"><div class="tile"><b>' + esc(j.queue_pos || '—') +
    '</b><span>of ' + esc(j.queue_total || '—') + ' in queue</span></div><div class="tile"><b>' +
    esc(j.eta_start || '—') + '</b><span>est. start</span></div></div>';
  h += '</div>';

  if (j.summary) {
    h += '<div class="card"><div class="row" style="justify-content:space-between;align-items:baseline">' +
      '<span class="sect">Read</span><span class="sub">claude · ' + ago(j.polled_at || S.polled_at) + '</span></div>' +
      '<div class="read">' + esc(j.summary) + '</div>';
    (j.notes || []).forEach(function (n) {
      var c = { good: 'var(--good)', warn: 'var(--pend)', critical: 'var(--critical)', info: 'var(--done)' }[n.level] || 'var(--done)';
      h += '<div class="bullet"><i style="background:' + c + '"></i><span>' + esc(n.txt) + '</span></div>';
    });
    h += '</div>';
  }

  if (m) {
    h += '<div class="card"><div class="mons">' + mons.map(function (x, k) {
      return '<div class="mon' + (k === i ? ' on' : '') + '" onclick="go({mon:' + k + '})">' + esc(x.label) + '</div>';
    }).join('') + '</div>' +
      '<div style="display:flex;align-items:baseline;gap:9px"><span class="big">' + esc(m.now) + '</span>' +
      '<span style="font:400 11.5px var(--ui);color:var(--sub)">' + esc(m.desc || '') + '</span></div>' +
      chart(m.history, 96) +
      '<div class="barlbl" style="color:var(--dim);font-size:10.5px"><span>' +
      esc(((m.history || [[]])[0] || [])[0]) + '</span><span>' +
      esc(((m.history || [[]])[(m.history || []).length - 1] || [])[0]) + '</span></div></div>';
  }

  h += '<div class="card"><div class="row" style="justify-content:space-between;align-items:baseline">' +
    '<span class="sect">Allocation</span><span class="sub">' + esc(j.node || '—') + '</span></div>' +
    '<div class="stats"><div><b>' + esc(j.ranks || '—') + '</b><span>ranks</span></div>' +
    '<div><b>' + esc(j.rss || '—') + '</b><span>rss / node</span></div>' +
    '<div><b>' + esc(j.s_per_step || '—') + '</b><span>s / step</span></div></div></div>';

  h += '<div class="card"><span class="sect">Artifacts</span><div class="stats">' +
    '<div><b>' + esc(j.restarts) + '</b><span>restarts</span></div>' +
    '<div><b>' + esc(j.posts) + '</b><span>post files</span></div>' +
    '<div><b>' + esc(j.frames) + '</b><span>frames</span></div></div>' +
    '<div class="sub">newest ' + esc(j.newest || '—') + '</div></div>';

  var tail = (j.log_tail || []).slice(-4);
  h += '<div class="logcard" onclick="go({view:\'log\'})">' +
    '<div style="display:flex;justify-content:space-between;color:rgba(235,235,245,.6);font:590 12px var(--mono)">' +
    '<span>' + esc(j.log_name || 'log') + '</span><span style="color:#0a84ff">open ›</span></div>' +
    (tail.length ? tail.map(function (l) { return '<div>' + esc(l) + '</div>'; }).join('')
      : '<div>(no output yet)</div>') + '</div>';

  h += '<div class="foot"><div>submitted ' + esc((j.submitted || '—').replace('T', ' ').slice(0, 16)) + '</div>' +
    '<div>' + esc(j.cmd || '—') + '</div><div>polled ' + ago(j.polled_at || S.polled_at) + ' · read-only</div></div>';
  return h + '</div>';
}

function logView() {
  var j = job(st.sel) || {};
  var h = '<div class="logview"><div class="hdr"><div class="back" onclick="go({view:\'detail\'})"><i>‹</i>Job</div>' +
    '<h1>' + esc(j.log_name || 'log') + '</h1>' +
    '<div style="font:400 11px var(--ui);color:rgba(255,255,255,.5)">' + (stale() ? 'stale' : 'last poll') + '</div></div>' +
    '<div style="padding:10px 0 60px">';
  var lines = j.log_tail || [];
  if (!lines.length) h += '<div class="logline"><i></i><span>(no output yet)</span></div>';
  lines.forEach(function (l, k) {
    h += '<div class="logline"><i>' + (k + 1) + '</i><span>' + esc(l) + '</span></div>';
  });
  h += '<div class="logline"><i></i><span style="background:rgba(52,199,89,.9);color:transparent">&nbsp;</span></div>';
  h += '</div><div style="padding:9px 16px calc(env(safe-area-inset-bottom) + 20px);' +
    'border-top:.5px solid rgba(255,255,255,.12);display:flex;justify-content:space-between;' +
    'font:400 11px var(--mono);color:rgba(255,255,255,.45)"><span>tail -' + lines.length + ' · ' +
    esc(j.log_path || '') + '</span><span>' + esc(j.log_size || '') + '</span></div></div>';
  return h;
}

function render() {
  document.getElementById('app').innerHTML =
    st.view === 'log' ? logView() : st.view === 'detail' ? detailView() : listView();
  window.scrollTo(0, 0);
  localStorage.setItem(VK, JSON.stringify({ cluster: st.cluster }));
}
function go(patch) { Object.assign(st, patch); render(); }
function recheck() {
  if (st.checking) return;
  st.checking = true; render();
  fetch('status.json?v=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); })
    .then(function (d) { S = d; }).catch(function () {})
    .then(function () { st.checking = false; render(); });
}
render();
recheck();
setInterval(recheck, 300000);
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') recheck(); });
window.addEventListener('pageshow', function () { recheck(); });
</script>
</body>
</html>
